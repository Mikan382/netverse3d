<!doctype html>
<html lang="vi" data-ui-quality="high">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thư viện giao diện · Netverse 3D</title>
    <link rel="stylesheet" href="./library.css" />
    <script type="module" src="./library.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a href="#foundation">Netverse 3D</a>
      <nav aria-label="Thư viện">
        <a href="#foundation" aria-current="location">Nền tảng</a>
        <a href="../">Wiki dự án</a>
      </nav>
    </header>
    <main id="foundation">
      <header>
        <h1>Thư viện giao diện</h1>
        <p>Token Saigon Soft-Future đang dùng trong game.</p>
      </header>
      <form id="theme-controls" class="controls">
        <label>Màu nhấn tiệm <input id="accent" type="color" value="#c4b6fd" /></label>
        <label
          >Mức chất lượng
          <select id="quality">
            <option value="high">Cao</option>
            <option value="low">Thấp</option>
          </select>
        </label>
        <label><input id="motion" type="checkbox" /> Giảm chuyển động</label>
        <label><input id="transparency" type="checkbox" /> Giảm trong suốt</label>
      </form>
      <section aria-labelledby="color-title">
        <h2 id="color-title">Màu</h2>
        <div id="colors" class="token-grid"></div>
      </section>
      <section aria-labelledby="contrast-title">
        <h2 id="contrast-title">Tương phản</h2>
        <p>Kính mờ được đo trên nền trắng để tính trường hợp sáng nhất.</p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Chữ hoặc dấu hiệu</th>
                <th scope="col">Mặt nền</th>
                <th scope="col">Tỉ lệ</th>
                <th scope="col">Ngưỡng</th>
              </tr>
            </thead>
            <tbody id="contrast"></tbody>
          </table>
        </div>
      </section>
      <section aria-labelledby="scale-title">
        <h2 id="scale-title">Chữ, khoảng cách và lớp</h2>
        <div id="scales" class="token-grid"></div>
      </section>
      <section aria-labelledby="motion-title">
        <h2 id="motion-title">Chuyển động</h2>
        <div id="motion-samples" class="token-grid"></div>
      </section>
    </main>
  </body>
</html>
